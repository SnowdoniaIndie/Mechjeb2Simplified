// SimpleAutopilot: each autopilot is its own flight computer (a MechJebCore subclass) embedded on a
// specific part. No blanket command-pod embed — install the part, get that autopilot (and its button).
// This REPLACES MechJeb's own auto-embed (MechJebNoCommandPod.cfg, deleted).
// No MechJebLocalSettings/unlockTechs by design: empty unlockTechs defaults to always-unlocked, so
// these are never tech-gated in career.

// Flight autopilot -> MK2 Drone Core
@PART[mk2DroneCore]:FOR[SimpleAutopilot]
{
  %MODULE[ModuleFlightAutopilot] {}
}

// Rover autopilot -> RoveMate (v1 hidden + v2 revamp, the one you actually place)
@PART[roverBody|roverBody_v2]:FOR[SimpleAutopilot]
{
  %MODULE[ModuleRoverAutopilot] {}
}
